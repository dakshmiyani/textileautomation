version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: textile-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: textile_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d textile_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Optional for background jobs / cache)
  redis:
    image: redis:7-alpine
    container_name: textile-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Backend Express Server
  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: textile-erp-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/textile_erp
      DB_CLIENT: pg
      JWT_SECRET: textile_erp_prod_secret_key_change_in_production
      JWT_REFRESH_SECRET: textile_erp_prod_refresh_secret_key_change_in_production
      WHATSAPP_AUTH_DIR: /app/storage/whatsapp-auth
      WHATSAPP_AUTO_CONNECT: "false"
    ports:
      - "5000:5000"
    volumes:
      - whatsapp_auth:/app/storage/whatsapp-auth
      - ./server/storage/exports:/app/storage/exports

  # 4. Frontend React Client (Vite Nginx Production Server)
  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: textile-erp-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  whatsapp_auth:
